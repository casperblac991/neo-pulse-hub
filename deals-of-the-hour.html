
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عروض الساعة - NEO PULSE HUB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css"> <!-- Link to main stylesheet -->
    <style>
        :root {
            --primary: #00d4ff;
            --secondary: #7c3aed;
            --accent: #ff00c8;
            --bg: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-card: #1f1f1f;
            --text: #ffffff;
            --text-muted: #b0b0b0;
            --border: #333333;
            --gradient-primary: linear-gradient(45deg, var(--primary), var(--secondary));
            --gradient-accent: linear-gradient(45deg, var(--accent), #ff6a88);
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }

        header {
            background-color: var(--bg-secondary);
            padding: 1rem 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary);
            text-decoration: none;
            margin-right: 1rem;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }

        nav ul li {
            margin-left: 1.5rem;
        }

        nav ul li a {
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: var(--primary);
        }

        .deals-hero {
            background: var(--bg);
            padding: 4rem 0;
            text-align: center;
        }

        .deals-hero h1 {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .deals-hero p {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 800px;
            margin: 0 auto 2rem;
        }

        .countdown-timer {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .countdown-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 100px;
        }

        .countdown-item span {
            font-size: 0.8rem;
            font-weight: normal;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .deals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .deal-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s;
            overflow: hidden;
            position: relative;
        }

        .deal-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 12px 30px rgba(255, 0, 200, 0.2);
        }

        .deal-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 1rem;
        }
        .deal-card img.image-fallback { object-fit: cover; }
        .deals-notice { grid-column: 1 / -1; border: 1px solid rgba(0,212,255,.26); background: rgba(0,212,255,.08); border-radius: 10px; padding: .8rem 1rem; color: #c8f6ff; font-size: .86rem; text-align: right; }
        .deal-visual-note { display:block; margin:-.55rem 0 .8rem; color:#9eefff; font-size:.72rem; }

        .deal-card h3 {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .deal-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .deal-card .price-old {
            text-decoration: line-through;
            color: var(--text-muted);
            font-size: 1rem;
            margin-right: 0.5rem;
        }

        .deal-card .price-new {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--primary);
        }

        .deal-card .discount-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--gradient-accent);
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .btn-buy-deal {
            background: var(--gradient-primary);
            color: white;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
            display: inline-block;
        }

        .btn-buy-deal:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 212, 255, 0.3);
        }

        footer {
            background-color: var(--bg-secondary);
            color: var(--text-muted);
            text-align: center;
            padding: 2rem 0;
            margin-top: 4rem;
            border-top: 1px solid var(--border);
        }

        @media (max-width: 768px) {
            .deals-hero h1 {
                font-size: 2rem;
            }
            .deals-hero p {
                font-size: 1rem;
            }
            .countdown-item {
                font-size: 1.5rem;
                padding: 0.8rem 1rem;
                min-width: 80px;
            }
            .countdown-item span {
                font-size: 0.7rem;
            }
            nav ul {
                flex-direction: column;
                align-items: center;
            }
            nav ul li {
                margin: 0.5rem 0;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a href="index.html" class="logo">NEO PULSE HUB</a>
            <nav>
                <ul>
                    <li><a href="index.html">الرئيسية</a></li>
                    <li><a href="products.html">المنتجات</a></li>
                    <li><a href="gift-finder.html">مكتشف الهدايا AI</a></li>

    <main>
        <section class="deals-hero">
            <div class="container">
                <h1>⚡ عروض الساعة الحصرية ⚡</h1>
                <p>لا تفوّت أفضل الصفقات على المنتجات الذكية! عروض تتغير كل ساعة، اغتنم الفرصة الآن قبل فوات الأوان.</p>
                
                <div class="countdown-timer">
                    <div class="countdown-item" id="hours">00<span>ساعة</span></div>
                    <div class="countdown-item" id="minutes">00<span>دقيقة</span></div>
                    <div class="countdown-item" id="seconds">00<span>ثانية</span></div>
                </div>

                <div class="deals-grid" id="dealsGrid">
                    <!-- Deals will be injected here -->
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 NEO PULSE HUB. جميع الحقوق محفوظة.</p>
        </div>
    </footer>

    <script>
        const deals = [
            {
                id: 'deal-1',
                name: 'سماعات الأذن اللاسلكية X-Pro',
                description: 'صوت نقي، إلغاء ضوضاء فعال، وعمر بطارية طويل.',
                image: 'https://m.media-amazon.com/images/I/61b+2G3-GFL._AC_SY679_.jpg',
                old_price: 120,

                discount: '34%',
                amazon_link: 'https://www.amazon.com/Sony-WH-1000XM5-Canceling-Headphones-Hands-Free/dp/B09JPK6L3K?tag=neopulsehub-20'
            },
            {
                id: 'deal-2',
                name: 'ساعة ذكية UltraFit Pro',
                description: 'تتبع اللياقة البدنية، معدل ضربات القلب، وإشعارات ذكية.',
                image: 'https://m.media-amazon.com/images/I/71X8Vb3gSLL._AC_SY679_.jpg',
                old_price: 180,
                new_price: 119,
                discount: '33%',
                amazon_link: 'https://www.amazon.com/Apple-Watch-Ultra-GPS-Cellular/dp/B0CHX912Y2?tag=neopulsehub-20'
            },
            {
                id: 'deal-3',
                name: 'مصباح ذكي متعدد الألوان HomeLux',
                description: 'تحكم بالإضاءة عبر الهاتف، 16 مليون لون، وجدولة ذكية.',
                image: 'https://m.media-amazon.com/images/I/71t+b-9eWCL._AC_SY679_.jpg',
                old_price: 45,
                new_price: 29,
                discount: '35%',
                amazon_link: 'https://www.amazon.com/Echo-Dot-5th-Gen-2022/dp/B09B8V1BM3?tag=neopulsehub-20'
            }
        ];

        function updateCountdown() {
            const now = new Date();
            const endOfHour = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours() + 1, 0, 0, 0);
            const timeLeft = endOfHour - now;

            const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

            document.getElementById('hours').innerHTML = String(hours).padStart(2, '0') + '<span>ساعة</span>';
            document.getElementById('minutes').innerHTML = String(minutes).padStart(2, '0') + '<span>دقيقة</span>';
            document.getElementById('seconds').innerHTML = String(seconds).padStart(2, '0') + '<span>ثانية</span>';

            if (timeLeft < 0) {
                clearInterval(countdownInterval);
                document.querySelector('.countdown-timer').innerHTML = '<p style="color: var(--accent);">انتهت العروض! ترقبوا عروضاً جديدة قريباً.</p>';
                // Optionally, reload deals or show a message
            }
        }

        const countdownInterval = setInterval(updateCountdown, 1000);
        updateCountdown(); // Initial call to display immediately
    </script>

</html>
