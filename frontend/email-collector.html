<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اشترك في نشرتنا - NEO PULSE HUB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary: #00d4ff;
            --secondary: #7c3aed;
            --accent: #ff00c8;
            --bg: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-card: #1f1f1f;
            --text: #ffffff;
            --text-muted: #b0b0b0;
            --border: #333333;
            --gradient-primary: linear-gradient(45deg, var(--primary), var(--secondary));
            --gradient-accent: linear-gradient(45deg, var(--accent), #ff6a88);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .email-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .email-modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .email-modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 2.5rem;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 212, 255, 0.2);
            animation: slideUp 0.3s ease;
            position: relative;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close-btn:hover {
            color: var(--accent);
        }

        .email-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .email-header h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .email-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .benefits-list {
            background: rgba(0, 212, 255, 0.05);
            border-left: 3px solid var(--primary);
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 5px;
        }

        .benefits-list ul {
            list-style: none;
        }

        .benefits-list li {
            padding: 0.4rem 0;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .benefits-list li:before {
            content: "✓ ";
            color: var(--primary);
            font-weight: bold;
            margin-right: 0.5rem;
        }

        .email-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            color: var(--text);
            font-weight: 500;
        }

        .form-group input {
            padding: 0.75rem;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(0, 212, 255, 0.1);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .submit-btn {
            padding: 0.85rem;
            background: var(--gradient-primary);
            color: var(--bg);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 2rem;
            color: #4ade80;
        }

        .success-message.active {
            display: block;
        }

        .success-message i {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .success-message p {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .success-message small {
            color: var(--text-muted);
            display: block;
        }

        .error-message {
            display: none;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 0.75rem;
            border-radius: 5px;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .error-message.active {
            display: block;
        }

        @media (max-width: 600px) {
            .email-modal {
                padding: 1.5rem;
            }

            .email-header h2 {
                font-size: 1.4rem;
            }

            .email-modal-overlay {
                align-items: flex-end;
            }

            .email-modal {
                width: 100%;
                border-radius: 15px 15px 0 0;
            }
        }
    </style>
</head>
<body>
    <!-- Email Collector Modal -->
    <div class="email-modal-overlay" id="emailModal">
        <div class="email-modal">
            <button class="close-btn" onclick="closeEmailModal()">&times;</button>
            
            <div class="email-header">
                <h2>🎁 اشترك في نشرتنا</h2>
                <p>احصل على أفضل العروض والمنتجات الجديدة مباشرة في بريدك</p>
            </div>

            <div class="benefits-list">
                <ul>
                    <li>عروض حصرية وخصومات خاصة</li>
                    <li>تقارير منتجات يومية احترافية</li>
                    <li>نصائح تسوق ذكية من الخبراء</li>
                    <li>أول من يعرف بالمنتجات الجديدة</li>
                </ul>
            </div>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage">
                <i class="fas fa-check-circle"></i>
                <p>شكراً لاشتراكك!</p>
                <small>سيصلك أول عرض خاص في أقرب وقت</small>
            </div>

            <form class="email-form" id="emailForm" onsubmit="submitEmail(event)">
                <div class="form-group">
                    <label for="subscriberName">الاسم الكامل</label>
                    <input type="text" id="subscriberName" name="name" placeholder="أدخل اسمك" required>
                </div>

                <div class="form-group">
                    <label for="subscriberEmail">البريد الإلكتروني</label>
                    <input type="email" id="subscriberEmail" name="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="subscriberInterests">اهتماماتك (اختياري)</label>
                    <input type="text" id="subscriberInterests" name="interests" placeholder="مثال: ساعات ذكية، سماعات، منزل ذكي">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="agreeTerms" name="agree" required>
                    <label for="agreeTerms" style="margin: 0;">أوافق على استقبال رسائل بريدية من NEO PULSE HUB</label>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">اشترك الآن</button>
            </form>
        </div>
    </div>

    <script>
        // Show email modal after 5 seconds or on page load
        function showEmailModal() {
            const modal = document.getElementById('emailModal');
            modal.classList.add('active');
        }

        function closeEmailModal() {
            const modal = document.getElementById('emailModal');
            modal.classList.remove('active');
        }

        async function submitEmail(event) {
            event.preventDefault();
            
            const name = document.getElementById('subscriberName').value;
            const email = document.getElementById('subscriberEmail').value;
            const interests = document.getElementById('subscriberInterests').value;
            const submitBtn = document.getElementById('submitBtn');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            const emailForm = document.getElementById('emailForm');

            // Clear previous messages
            errorMessage.classList.remove('active');
            successMessage.classList.remove('active');

            // Disable submit button
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;

            try {
                // Send to backend API
                const response = await fetch('/api/subscribe', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        interests: interests,
                        timestamp: new Date().toISOString()
                    })
                });

                if (response.ok) {
                    // Show success message
                    emailForm.style.display = 'none';
                    successMessage.classList.add('active');
                    
                    // Reset form
                    document.getElementById('emailForm').reset();
                    
                    // Close modal after 3 seconds
                    setTimeout(() => {
                        closeEmailModal();
                        emailForm.style.display = 'block';
                    }, 3000);
                } else {
                    throw new Error('فشل الاشتراك. حاول مرة أخرى.');
                }
            } catch (error) {
                errorMessage.textContent = error.message || 'حدث خطأ. يرجى المحاولة لاحقاً.';
                errorMessage.classList.add('active');
            } finally {
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            }
        }

        // Show modal on page load (after 5 seconds)
        window.addEventListener('load', () => {
            setTimeout(showEmailModal, 5000);
        });

        // Close modal when clicking outside
        document.getElementById('emailModal').addEventListener('click', (e) => {
            if (e.target.id === 'emailModal') {
                closeEmailModal();
            }
        });
    </script>
</body>
</html>
