<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنتجات العالمية | NEO PULSE HUB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020510;
            --surface: #0a0d1a;
            --surface2: #0f1423;
            --border: rgba(99,179,237,.12);
            --border2: rgba(99,179,237,.25);
            --blue: #3b82f6;
            --blue2: #60a5fa;
            --cyan2: #22d3ee;
            --text: #e2e8f0;
            --muted: rgba(226,232,240,.55);
            --r: 12px;
            --rp: 50px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        
        nav { position: sticky; top: 0; z-index: 200; display: flex; align-items: center; justify-content: space-between; padding: .9rem 2.5rem; background: rgba(2,5,16,.92); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
        .nav-logo { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; font-weight: 700; color: var(--blue2); text-decoration: none; }
        .nav-right { display: flex; align-items: center; gap: 1rem; }
        .lang-switch { display: flex; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--rp); overflow: hidden; }
        .lang-btn { padding: .3rem .8rem; font-size: .8rem; color: var(--muted); cursor: pointer; border: none; background: none; }
        .lang-btn.active { background: var(--blue); color: #fff; }
        .currency-select { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: var(--rp); padding: 0.3rem 0.5rem; font-size: 0.8rem; cursor: pointer; outline: none; }
        .nav-cart { padding: 0.4rem 1rem; background: rgba(59, 130, 246, 0.1); border: 1px solid var(--border2); color: var(--blue2); border-radius: var(--rp); text-decoration: none; font-size: 0.85rem; display: flex; align-items: center; gap: 5px; }

        .header-section { margin-bottom: 3rem; text-align: center; }
        .header-section h1 { font-size: 2.5rem; margin-bottom: 1rem; background: linear-gradient(135deg, var(--blue2), var(--cyan2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .sidebar { margin-bottom: 2rem; }
        .categories { display: flex; gap: 0.8rem; flex-wrap: wrap; justify-content: center; }
        .category-btn { padding: 0.6rem 1.2rem; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); border-radius: var(--rp); cursor: pointer; transition: all 0.3s; font-size: 0.9rem; }
        .category-btn:hover, .category-btn.active { background: var(--blue); border-color: var(--blue); color: white; }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; }
        .product-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; transition: all 0.3s; cursor: pointer; position: relative; }
        .product-card:hover { transform: translateY(-8px); border-color: var(--blue2); box-shadow: 0 15px 40px rgba(59, 130, 246, 0.2); }
        .product-image { height: 220px; background: rgba(59, 130, 246, 0.05); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .product-image img { max-width: 90%; max-height: 90%; object-fit: contain; }
        .badge { position: absolute; top: 10px; right: 10px; background: #ef4444; color: white; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
        
        .product-info { padding: 1.5rem; }
        .product-category { font-size: 0.7rem; color: var(--cyan2); text-transform: uppercase; margin-bottom: 0.5rem; }
        .product-name { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.8rem; height: 2.6rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .product-rating { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; font-size: 0.85rem; color: var(--muted); }
        .stars { color: #fbbf24; }
        .price-row { display: flex; align-items: baseline; gap: 0.8rem; margin-bottom: 1.2rem; }
        .price { font-size: 1.4rem; font-weight: 800; color: var(--blue2); font-family: 'Orbitron', sans-serif; }
        .original-price { font-size: 0.9rem; color: var(--muted); text-decoration: line-through; }
        .buy-btn { width: 100%; padding: 0.8rem; background: linear-gradient(135deg, var(--blue), var(--purple)); color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: all 0.3s; text-align: center; text-decoration: none; display: block; }
        
        .user-dropdown { position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; right: 0; background: var(--surface); min-width: 160px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); z-index: 300; border-radius: 8px; border: 1px solid var(--border); overflow: hidden; }
        .dropdown-content a { color: var(--text); padding: 12px 16px; text-decoration: none; display: block; font-size: 0.85rem; }
        .dropdown-content a:hover { background: rgba(59, 130, 246, 0.1); color: var(--blue2); }
        .user-dropdown:hover .dropdown-content { display: block; }

        @media (max-width: 768px) { .container { padding: 1rem; } .header-section h1 { font-size: 1.8rem; } }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="nav-logo">NEO PULSE HUB</a>
        <div class="nav-right">
            <div class="lang-switch">
                <button class="lang-btn active" id="langAr" onclick="switchLanguage('ar')">عربي</button>
                <button class="lang-btn" id="langEn" onclick="switchLanguage('en')">EN</button>
            </div>
            <select class="currency-select" onchange="changeCurrency(this.value)">
                <option value="USD">$ USD</option>
                <option value="SAR">ر.س SAR</option>
                <option value="AED">د.إ AED</option>
                <option value="EUR">€ EUR</option>
            </select>
            <div id="auth-nav-item"></div>
        </div>
    </nav>

    <div class="container">
        <div class="header-section">
            <h1 id="pageTitle">سوق التقنية العالمي</h1>
            <p id="pageSub">أفضل المنتجات الذكية من أمازون وعلي بابا في مكان واحد</p>
        </div>

        <div class="sidebar">
            <div class="categories" id="categoryList">
                <button class="category-btn active" onclick="filterCategory('all', this)">جميع المنتجات</button>
                <button class="category-btn" onclick="filterCategory('smartwatch', this)">ساعات ذكية</button>
                <button class="category-btn" onclick="filterCategory('earbuds', this)">سماعات</button>
                <button class="category-btn" onclick="filterCategory('smart-home', this)">منزل ذكي</button>
                <button class="category-btn" onclick="filterCategory('productivity', this)">إنتاجية</button>
            </div>
        </div>

        <div class="products-grid" id="productsGrid">
            <div style="text-align:center; padding:50px; grid-column:1/-1;">
                <p>جاري تحميل المنتجات العالمية...</p>
            </div>
        </div>
    </div>

    <script src="scripts/auth-client.js"></script>
    <script>
        let currentLang = localStorage.getItem('nph_lang') || 'ar';
        let allProducts = [];
        let currentCategory = 'all';

        async function fetchProducts() {
            try {
                const response = await fetch('./products.json');
                allProducts = await response.json();
                renderProducts();
            } catch (error) {
                console.error('Error fetching products:', error);
                document.getElementById('productsGrid').innerHTML = '<p>تعذر تحميل المنتجات حالياً.</p>';
            }
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            const lang = currentLang;
            
            let filtered = allProducts;
            if (currentCategory !== 'all') {
                filtered = allProducts.filter(p => p.category === currentCategory);
            }

            grid.innerHTML = filtered.map(p => {
                const name = p.name[lang] || p.name['en'] || p.name;
                const cat = p.category_ar || p.category;
                const price = getFormattedPrice(p);
                const origPrice = p.original_price ? getFormattedPrice(p, true) : '';
                
                return `
                    <div class="product-card" onclick="window.location.href='product-detail.html?id=${p.id}'">
                        <div class="product-image">
                            <img src="${p.image}" alt="${name}" onerror="this.src='https://placehold.co/400x400/0a0d1a/60a5fa?text=IMG'">
                            ${p.badge ? `<span class="badge">${p.badge[lang] || p.badge}</span>` : ''}
                        </div>
                        <div class="product-info">
                            <div class="product-category">${cat}</div>
                            <h3 class="product-name">${name}</h3>
                            <div class="product-rating">
                                <span class="stars">★★★★★</span>
                                <span>${p.rating || 4.5}/5</span>
                                <span>(${p.reviews || 0})</span>
                            </div>
                            <div class="price-row">
                                <span class="price">${price}</span>
                                ${origPrice ? `<span class="original-price">${origPrice}</span>` : ''}
                            </div>
                            <a href="${p.affiliate_amazon}" target="_blank" class="buy-btn" onclick="event.stopPropagation()">اشترِ من أمازون</a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getFormattedPrice(product, isOriginal = false) {
            const currency = localStorage.getItem('nph_currency') || 'USD';
            const symbols = { 'USD': '$', 'SAR': 'ر.س', 'AED': 'د.إ', 'EUR': '€' };
            const rates = { 'SAR': 3.75, 'AED': 3.67, 'EUR': 0.92, 'USD': 1 };
            
            let val = isOriginal ? product.original_price : product.price;
            if (!val) return '';

            if (product.global_prices && product.global_prices[currency]) {
                val = product.global_prices[currency];
            } else {
                val = (val * (rates[currency] || 1)).toFixed(2);
            }
            
            return `${symbols[currency]} ${val}`;
        }

        function filterCategory(category, btn) {
            currentCategory = category;
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderProducts();
        }

        function switchLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('nph_lang', lang);
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langAr').classList.toggle('active', lang === 'ar');
            document.getElementById('langEn').classList.toggle('active', lang === 'en');
            
            const titles = {
                ar: { title: "سوق التقنية العالمي", sub: "أفضل المنتجات الذكية من أمازون وعلي بابا في مكان واحد" },
                en: { title: "Global Tech Marketplace", sub: "Best smart products from Amazon and Alibaba in one place" }
            };
            document.getElementById('pageTitle').textContent = titles[lang].title;
            document.getElementById('pageSub').textContent = titles[lang].sub;
            
            renderProducts();
        }

        function changeCurrency(newCurrency) {
            localStorage.setItem('nph_currency', newCurrency);
            renderProducts();
        }

        window.onload = () => {
            const savedCurrency = localStorage.getItem('nph_currency') || 'USD';
            const select = document.querySelector('.currency-select');
            if (select) select.value = savedCurrency;
            
            const savedLang = localStorage.getItem('nph_lang') || 'ar';
            switchLanguage(savedLang);
            
            fetchProducts();
        };
    </script>
</body>
</html>
