services:
  - type: web
    name: neo-pulse-hub
    runtime: node
    rootDir: .
    buildCommand: npm exec --yes pnpm@10.15.1 -- install --frozen-lockfile && npm exec --yes pnpm@10.15.1 -- run build
    startCommand: npm run start
    healthCheckPath: /healthz
    domains:
      - neo-pulse-hub.it.com
      - www.neo-pulse-hub.it.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: API_SECRET
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OAUTH_SERVER_URL
        sync: false
      - key: VITE_OAUTH_PORTAL_URL
        sync: false
      - key: VITE_APP_ID
        sync: false
      - key: SITE_URL
        value: https://neo-pulse-hub.it.com
      - key: AFFILIATE_APPROVED_NETWORKS
        sync: false
      - key: AMAZON_ASSOCIATE_TAG
        sync: false
      - key: AMAZON_PAAPI_ACCESS_KEY
        sync: false
      - key: AMAZON_PAAPI_SECRET_KEY
        sync: false
      - key: AMAZON_PAAPI_PARTNER_TAG
        sync: false
      - key: AMAZON_PAAPI_PARTNER_TYPE
        value: Associates
      - key: AMAZON_PAAPI_REGION
        sync: false
      - key: AMAZON_PAAPI_HOST
        sync: false
      - key: EBAY_CAMPAIGN_ID
        sync: false
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      - key: AWIN_PUBLISHER_ID
        sync: false
      - key: AWIN_API_TOKEN
        sync: false
      - key: CJ_PUBLISHER_ID
        sync: false
      - key: CJ_API_TOKEN
        sync: false
      - key: IMPACT_PARTNER_ID
        sync: false
      - key: IMPACT_API_TOKEN
        sync: false
      - key: RAKUTEN_PUBLISHER_ID
        sync: false
      - key: RAKUTEN_API_TOKEN
        sync: false
      - key: ALIEXPRESS_PUBLISHER_ID
        sync: false
      - key: ALIEXPRESS_API_TOKEN
        sync: false
