services:
  - type: web
    name: neo-pulse-hub
    runtime: node
    buildCommand: npm exec --yes pnpm@10.15.1 -- install --frozen-lockfile && npm exec --yes pnpm@10.15.1 -- run build
    # Compatibility entry point for existing Render services configured with node server.js.
    # It imports the canonical production bundle from dist/index.js.
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: API_SECRET
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OAUTH_SERVER_URL
        sync: false
      - key: VITE_APP_ID
        sync: false
      - key: SITE_URL
        value: https://neo-pulse-hub.it.com
