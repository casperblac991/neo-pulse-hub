name: Daily Article Generator
on:
  schedule:
    # يعمل يومياً الساعة 8:00 صباحاً (UTC)
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  generate-article:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Generate daily article
        run: |
          python3 daily_article_generator.py
          
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "📝 مقالة يومية جديدة - $(date +'%Y-%m-%d')"
          git push
