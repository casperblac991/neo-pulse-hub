name: Daily Social Media Campaign

on:
  schedule:
    - cron: '0 7 * * *'   # كل يوم الساعة 7 صباحاً UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-campaign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate social media campaign
        run: python3 scripts/generate_social_campaign.py

      - name: Commit campaign
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add campaigns/
          git diff --staged --quiet || git commit -m "📢 حملة تسويقية يومية - $(date +'%Y-%m-%d') [skip ci]"
          git push
