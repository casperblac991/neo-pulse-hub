name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate daily product article
        run: python3 daily_article_generator.py || echo "No article needed today"

      - name: Commit any new content
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📝 Auto-update - $(date +'%Y-%m-%d %H:%M') [skip ci]"
            git push origin HEAD:main
          fi

      - name: Verify deployment
        run: |
          echo "✅ Deployment ready"
          echo "🌐 Site: https://neo-pulse-hub.it.com"
