name: Deploy to Production
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Generate daily product article
        run: |
          python3 daily_article_generator.py || echo "No article needed today"
      
      - name: Commit any new content
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "📝 Auto-update - $(date +'%Y-%m-%d %H:%M')"
          git push || echo "Push skipped - no remote configured"
      
      - name: Verify deployment
        run: |
          echo "✅ Deployment ready"
          echo "📁 Files committed to main branch"
          echo "🌐 Site: https://neo-pulse-hub.it.com"
          echo ""
          echo "Note: If using GitHub Pages, enable it in Settings > Pages"
          echo "If using external hosting, configure webhook in your hosting provider"