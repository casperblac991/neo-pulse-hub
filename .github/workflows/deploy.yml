name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check requests

      - name: Validate canonical catalog and AI engine
        run: |
          python3 scripts/normalize_catalog.py --check
          python3 -m py_compile backend/ai_engine.py backend/ai_orchestrator.py
          python3 -m unittest discover -s backend -p 'test_ai_engine.py' -v

      - name: Build React application
        run: |
          npm exec --yes pnpm@10.15.1 -- install --frozen-lockfile
          npm exec --yes pnpm@10.15.1 -- run build

      - name: Commit any new content
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📝 Auto-update - $(date +'%Y-%m-%d %H:%M') [skip ci]"
            git push origin HEAD:main
          fi

      - name: Verify deployment
        run: |
          test -f CNAME
          test "$(cat CNAME)" = "neo-pulse-hub.it.com"
          echo "✅ GitHub Pages deployment source validated"
          echo "🌐 Site: https://neo-pulse-hub.it.com"
